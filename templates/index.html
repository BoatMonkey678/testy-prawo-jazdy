<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testy Prawo Jazdy</title>
    <link rel="stylesheet" href="../static/style.css">
</head>
<body>
    <div class="container">
        <h1>Egzaminy Prawo Jazdy</h1>
        
        <div class="section">
            <button id="start-test">Rozpocznij</button>
        </div>

        <div class="section">
            <button onclick="window.location.href='/about'">O Programie</button>
        </div>
    </div>

    <script>window.APP_CONFIG = { apiUrl: "{{ api_url }}" };</script>
    <script src="../static/app.js"></script>
    <script>

        document.getElementById("start-test").addEventListener("click", async () => {
            try {
                await App.makeRequest("POST", "/reset");
                window.location.href = "/question";
            } catch (e) {
                console.error("Failed to start test", e);
            }
        });
    </script>
</body>
</html>
