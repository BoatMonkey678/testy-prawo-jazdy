<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testy Prawo Jazdy</title>
    <link rel="stylesheet" href="../static/style.css">
</head>
<body>
    <div class="container">
        <h1>Egzaminy Prawo Jazdy</h1>
        
        <div class="section">
            <button onclick="window.location.href='/question'">Rozpocznij</button>
        </div>

        <div class="section">
            <button onclick="window.location.href='/about'">O Programie</button>
        </div>
    </div>

    <script>
        const API_URL = "{{ api_url }}";

        async function makeRequest(method, endpoint, body = null) {
            const options = {
                method: method,
                headers: {
                    "Content-Type": "application/json"
                }
            };
            if (body) options.body = JSON.stringify(body);
            
            const response = await fetch(API_URL + endpoint, options);
            const data = await response.json();
            if (!response.ok) {
                throw new Error(`${response.status}: ${data.detail || response.statusText}`);
            }
            return data;
        }

        makeRequest("POST", "/reset");
    </script>
</body>
</html>
