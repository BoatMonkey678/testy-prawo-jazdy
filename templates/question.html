<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testy Prawo Jazdy</title>
    <link rel="stylesheet" href="../static/style.css">
</head>
<body>
    <div class="container">
        <div id="generic-desc"></div>
        <div id="media"></div>
        <p id="question-desc"></p>
        <div id="b-row" class="button-row"></div>
        <button id="submit">Kontynuuj [ENTER]</button>
    </div>

    <script>
        let selected_answer = "";
        let question_id = 0;
        const API_URL = "{{ api_url }}";    
        const answerRow = document.getElementById("b-row");

        answerRow.addEventListener("click", (event) => {
            const clickedButton = event.target.closest(".answer-button");
            if (!clickedButton) return;

            selectAnswer(clickedButton.dataset.answer);
        });

        function selectAnswer(answerKey) {
            const selectedButton = answerRow.querySelector(`[data-answer="${answerKey}"]`);
            if (!selectedButton) return;

            answerRow.querySelectorAll(".answer-button").forEach((button) => {
                button.classList.remove("selected");
            });
            selectedButton.classList.add("selected");
            selected_answer = answerKey;
        }

        document.getElementById("submit").addEventListener("click", async () => {
            try {
                await makeRequest("POST", "/question/submit-answer", { id: question_id, answer: selected_answer });
            } catch (e) {
                console.error("Failed to submit answer", e);
                return;
            }
            
            window.location.href = '/question';
        });

        async function makeRequest(method, endpoint, body = null) {
            const options = {
                method: method,
                headers: {
                    "Content-Type": "application/json"
                }
            };
            if (body) options.body = JSON.stringify(body);
            
            const response = await fetch(API_URL + endpoint, options);
            const data = await response.json();
            if (!response.ok) {
                throw new Error(`${response.status}: ${data.detail || response.statusText}`);
            }
            return data;
        }

        async function getNextQuestion() {
            try {
                const data = await makeRequest("GET", "/question/get");

                if (data === null) {
                    window.location.href = "/results";
                    return;
                }

                if (data.special) {
                    document.getElementById("generic-desc").innerHTML = `
                    <p>Zakres: Specjalistyczny, Punkty: ${data.points}</p>
                    `
                }
                else {
                    document.getElementById("generic-desc").innerHTML = `
                    <p>Zakres: Podstawowy, Punkty: ${data.points}</p>
                    `
                }
                
                writeDescription(data.description);
                setMedia(data.media);
                answerRow.innerHTML = "";
                selected_answer = "";

                Object.entries(data.answers).forEach(([key, value]) => {
                    writeAnswers(key, value);
                })
                
                question_id = data.id;
                return;
            } catch (e) {
                console.error("Failed to load next question:", e);
            }
        }

        function writeDescription(desc) {
            document.getElementById("question-desc").textContent = desc;
        }

        function setMedia(media) {
            const mediaElement = document.getElementById("media");
            const mediaName = typeof media === "string" ? media.trim() : "";
            const mediaPath = encodeURIComponent(mediaName);

            if (!mediaName) {
                mediaElement.innerHTML = `<img width="480" height="270" src=../static/no-media.jpg>`;
                return;
            }

            if (mediaName.toLowerCase().endsWith(".wmv"))
            {
                mediaElement.innerHTML = `
                <video width="480" height="270" controls>
                    <source src="/resources/media/${mediaPath.replace(/\.wmv$/i, ".mp4")}" type="video/mp4">
                    Your browser does not support the video tag.
                </video>`;
            }   
            else if (/\.(jpg|jpeg|png|gif|webp)$/i.test(mediaName)) {
                mediaElement.innerHTML = `<img width="480" height="270" src="../resources/media/${mediaPath}">`;
            }
            else {
                mediaElement.innerHTML = `<img width="480" height="270" src="../static/no-media.jpeg">`;
            }
        }

        function writeAnswers(button, answer) {
            answerRow.innerHTML += `<button class="answer-button" data-answer="${button}">${button}: ${answer}</button>`;
        }

        document.addEventListener("keydown", (event) => {
            if (event.key === "Enter") {
                document.getElementById("submit").click();
                return;
            }

            const answerKey = event.key.toUpperCase();
            if (["A", "B", "C", "T", "N"].includes(answerKey)) {
                selectAnswer(answerKey);
            }
        });

        getNextQuestion();
    </script>
</body>
</html>
