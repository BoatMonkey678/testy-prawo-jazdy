<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testy Prawo Jazdy</title>
    <link rel="stylesheet" href="../static/style.css">
</head>
<body>
    <div class="container">
        <p id="generic-desc"></p>
        <p id="media"></p>
        <p id="description"></p>
        <div id="b-row" class="button-row"></div>
        <p id="selected_answer"></p>
        <p id="good_answer"></p>

        <div class="section">
            <button onclick="window.location.href='/results'">Powrót</button>
        </div>
    </div>

    <script>window.APP_CONFIG = { apiUrl: "{{ api_url }}" };</script>
    <script src="../static/app.js"></script>
    <script>
        const answerRow = document.getElementById("b-row");

        async function setValues() {
            const data = JSON.parse(sessionStorage.getItem("result-question"));

            writeDescription(data.description);
            App.setMedia(data.media);

            if (data.special) {
                document.getElementById("generic-desc").textContent = `Zakres: Specjalistyczny, Punkty: ${data.points}`
            }
            else {
                document.getElementById("generic-desc").textContent = `Zakres: Podstawowy, Punkty: ${data.points}`
            }

            Object.entries(data.answers).forEach(([key, value]) => {
                const buttonStyle = key === data.correct_answer
                    ? "correct-answer"
                    : key === data.selected_answer
                        ? "wrong-answer"
                        : "";
                App.renderAnswers(answerRow, { [key]: value }, buttonStyle);
            })

            if (data.selected_answer === data.correct_answer) {
                document.getElementById("selected_answer").textContent = "Wybrano poprawną odpowiedź"
            }
            else {
                if (data.selected_answer === "") {
                    document.getElementById("selected_answer").textContent = `Nie wybrano żadnej odpowiedzi`;
                }
                else {
                    document.getElementById("selected_answer").textContent = `Wybrano odpowiedź: ${data.selected_answer}`;
                }
                document.getElementById("good_answer").textContent = `Poprawna odpowiedź: ${data.correct_answer}`;
            }
        }

        function writeDescription(desc) {
            document.getElementById("description").textContent = desc;
        }

        setValues();
    </script>
</body>
</html>
