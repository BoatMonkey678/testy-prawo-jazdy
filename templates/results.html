<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testy Prawo Jazdy</title>
    <link rel="stylesheet" href="../static/style.css">
</head>
<body>
    <div class="container">
        <h1>Wyniki</h1>
        <p id="total-score"></p>
        <p>Pytania podstawowe</p>
        <div id="scoreboard-normal"></div>
        <p>Pytania specjalistyczne</p>
        <div id="scoreboard-special"></div>
        
        <div class="section">
            <button onclick="window.location.href='/'">Ekran Startowy</button>
        </div>
    </div>

    <script>window.APP_CONFIG = { apiUrl: "{{ api_url }}" };</script>
    <script src="../static/app.js"></script>
    <script>

        async function setValues() {
            const data = await App.makeRequest("GET", "/results/get")

            document.getElementById("total-score").textContent = `${data.points}/74 punkty`;

            let non_special_index = 1
            let special_index = 1

            data.questions.forEach((element) => {
                const isSpecial = element.special;
                const number = isSpecial ? special_index++ : non_special_index++;
                const containerId = isSpecial ? "scoreboard-special" : "scoreboard-normal";
                const className = element.selected_answer === element.correct_answer
                    ? "correct-answer"
                    : "wrong-answer";

                addQuestionButton(containerId, className, number, element);
            });
        }

        function addQuestionButton(containerId, className, number, element) {
            const button = document.createElement("button");
            button.className = className;
            button.textContent = number;
            button.addEventListener("click", () => {
                sessionStorage.setItem("result-question", JSON.stringify(element));
                window.location.href = "/results/details";
            });
            document.getElementById(containerId).appendChild(button);
        }

        setValues();
    </script>
</body>
</html>
